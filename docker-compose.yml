version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
      - OLLAMA_ENABLED=false
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./backend/app:/app/app:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dockerfile-gen-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend/app:/app/app:ro
      - ./frontend/components:/app/components:ro
      - ./frontend/hooks:/app/hooks:ro
      - ./frontend/services:/app/services:ro
      - ./frontend/types:/app/types:ro
    depends_on:
      - backend
    networks:
      - dockerfile-gen-network

  # Ollama (optional - for AI optimization)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ai
    networks:
      - dockerfile-gen-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  dockerfile-gen-network:
    driver: bridge

volumes:
  ollama_data: